<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale=1.0>
        <title>NumStrike | A Fun Math Game</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Space+Mono:wght@400;700&display=block">
    </head>

    <body> 
        <div id="overlay-start" class="overlay active">
            <div class="overlay-box">
                <div class="overlay-tag">NumStrike</div>
                <h1 class="overlay-title">EQUATIONS<br>FALL.<br>YOU SOLVE.</h1>
                <p class="overlay-dec">Type the correct answer before the equation hits the ground. Miss there- game over.</p>
                <div class="overlay-meta">
                    <span class="meta-item">LEVEL SCALING</span>
                    <span class="meta-item">STREAK BONUS</span>
                    <span class="meta-item">BEST SCORE SAVED</span>
                </div>
                <button id="btn-start" class="btn-primary">START GAME -></button>
                <button id="btn-instructions" class="btn-secondary">BACK TO ARCADE MENU</button>
            </div>
        </div>


        <div id="overlay-gameover" class="overlay">
            <div class="overlay-box">
                <div class="overlay-tag gameover-tag">GAME OVER</div>
                <h2 class="overlay-title">NICE TRY!</h2>
                <div class="result-grid">
                    <div class="result-item">
                        <span class="result-label">SCORE:</span>
                        <span class="result-value" id="final-score">0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">LEVEL</span>
                        <span class="result-value" id="final-level">1</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">BEST STREAK</span>
                        <span class="result-value" id="final-streak">0</span>
                    </div>
                </div>
                <div id="new-best-banner" class="new-best hidden">★ NEW BEST SCORE ★</div>
                <button id="btn-restart" class="btn-primary">PLAY AGAIN -></button>
                <button id="btn-back-over" class="btn-secondary">BACK TO ARCADE MENU</button>
            </div>
        </div>

    </body>
</html>
