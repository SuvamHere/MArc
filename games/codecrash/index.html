<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" content="width=device-width, initial-scale = 1.0">
    <title>CODECRASH -Suvam's MArc</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay-start" class="overlay active">
        <div class="overlay-box">
            <div class="overlay-tag">CODECRASH</div>
            <h1 class="overlay-title">CODE<br>RUNS.<br>FIND<br>THE BUG.</h1>
            <p class="overlay-desc">
                A broken code snippet appears. Four lines are highlighted.
                Click the one with the bug before time runs out.
            </p>
            <div class="overlay-meta">
                <span class="meta-item"> CLICK THE BUG </span>
                <span class="meta-item">TIMER SHRINKS</span>
                <span class="meta-item">STREAK BONUS</span>
            </div>
            <button id="btn-start" class="btn-primary">START GAME -</button>
            <button id="btn-back-start" class="btn-secondary">BACK TO ARCADE</button>
        </div>
    </div>

    <div id="overlay-gameover" class="overlay">
        <div class="overlay-box">
            <div class="overlay-tag-gameover-tag">GAME OVER</div>
            <h2 class="overlay-title">BUG<br>WON.</h2>
            <div class="result-grid">
                <div class="result-item">
                    <span class="result-label">SCORE</span>
                    <span class="result-value" id="final-score">0</span>
                </div>
                <div class="result-item">
                    <span class="result-label">BEST</span>
                    <span class="result-value" id="final-best">0</span>
                </div>
                <div class="result-item">
                    <span class="result-item">ROUND</span>
                    <span class="result-value" id="final-round">1</span>
                </div>
                <div class="result-item">
                    <span class="result-label">BEST STREAK</span>
                    <span class="result-value" id="final-streak">0</span>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
