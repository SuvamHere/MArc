<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WireFixer - Suvam's Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <div id="overlay-start" class="overlay active">
    <div class="overlay-box">
      <div class="overlay-tag">WIREFIXER</div>
      <h1 class="overlay-title">CIRCUIT<br>BROKEN.<br>FIX IT.</h1>
      <p class="overlay-desc">
        A wire is broken somewhere in the circuit.
        Drag the correct replacement wire to the gap
        before the timer runs out.
      </p>
      <div class="overlay-meta">
        <span class="meta-item">DRAG TO FIX</span>
        <span class="meta-item">TIMER SHRINKS</span>
        <span class="meta-item">3 LIVES</span>
      </div>
      <button id="btn-start" class="btn-primary">START GAME →</button>
      <button id="btn-back-start" class="btn-secondary">← BACK TO ARCADE</button>
    </div>
  </div>
</body>
