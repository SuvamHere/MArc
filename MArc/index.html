<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suvam's Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Space+Mono:wght@400;700&display=block">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="screen-landing" class="screen active">
        <div class="landing-inner">
            <div class="arcade-tag">// MArc v1.0 //</div>
            <h1 class="arcade-title">
                <span class="title-solid">PLAY</span>
                <span class="title-hollow">GAMES</span>
            </h1>
            <p class="arcade-sub">Math * Code * Circuits -- pick your fight.</p>
            <button class="btn-primary" id="btn-enter">Enter the Arcade: </button>
        </div>
        <div class="landing-deco" aria-hidden="true">
            <span class="deco-star">★</span>
        </div>
    </div>

    <div id="screen-username" class="screen">
        <div class="username-inner">
            <div class="arcade-tag">WHO ARE YOU?</div>
            <h2 class="gate-title">PICK YOUR <br><span class="title-accent">NICKNAME.</span></h2>
            <p class="gate-sub">No signup . No email. Just a name. </p>
            <div class="username-form">
                <input 
                type="text"
                id="username-input"
                class="username-field"
                placeholder="e.g. tungtungtungsahur"
                maxlength="20"
                autocomplete="off"
                spellcheck="false"
                >
                <div class="username-hint" id="username-hint"></div>
                <button class="btn-primary" id="btn-play">LET'S PLAY</button>
            </div>    
        </div>
    </div>

</body>
</html>
